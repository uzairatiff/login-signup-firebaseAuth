<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup & Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body onclick="onload" class="bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 flex justify-center items-center min-h-screen">
  <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md">
    <!-- Signup Form -->
    <div id="signupForm" class="space-y-4">
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Create Account</h2>
      <div class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-600 mb-2">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-200 hover:border-pink-500" />
        </div>
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-600 mb-2">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-200 hover:border-pink-500" />
        </div>
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-600 mb-2">Password</label>
          <input type="password" id="password" placeholder="Enter your password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-200 hover:border-pink-500" />
        </div>
        <div>
          <button onclick="signUp()" class="w-full bg-pink-500 text-white py-2 rounded-lg text-lg font-semibold transition duration-200 hover:bg-pink-600 focus:outline-none focus:ring-4 focus:ring-pink-300">
            Sign Up
          </button>
        </div>
        <div class="text-center mt-4">
          <p class="text-sm text-gray-600">Already have an account? <a href="javascript:void(0)" onclick="showLoginForm()" class="text-pink-500 hover:underline">Sign In</a></p>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="space-y-4 hidden">
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Login</h2>
      <div class="space-y-4">
        <div>
          <label for="emailLogin" class="block text-sm font-semibold text-gray-600 mb-2">Email Address</label>
          <input type="email" id="emailLogin" placeholder="Enter your email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-200 hover:border-pink-500" />
        </div>
        <div>
          <label for="passwordLogin" class="block text-sm font-semibold text-gray-600 mb-2">Password</label>
          <input type="password" id="passwordLogin" placeholder="Enter your password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-200 hover:border-pink-500" />
        </div>
        <div>
          <button onclick="signIn()" class="w-full bg-pink-500 text-white py-2 rounded-lg text-lg font-semibold transition duration-200 hover:bg-pink-600 focus:outline-none focus:ring-4 focus:ring-pink-300">
            Login
          </button>
        </div>
        <div class="text-center mt-4">
          <p class="text-sm text-gray-600">Don't have an account? <a href="javascript:void(0)" onclick="showSignupForm()" class="text-pink-500 hover:underline">Sign Up</a></p>
        </div>
      
        </div>
      </div>
    </div>
  </div>

  <script>
    function showSignupForm() {
      document.getElementById('signupForm').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
    }

    function showLoginForm() {
      document.getElementById('signupForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    }
  </script>
  <script type="module" src="signup index.js"></script>
  <script type="module" src="firebaseAuth index.js"></script>
</body>
</html>
